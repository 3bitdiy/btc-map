<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Western Balkans Artist Residencies</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <div id="app">

    <aside id="left-sidebar" aria-label="Colony browser">
      <section id="brand-card" aria-label="Project identity">
        <div class="brand-mark-wrap">
          <img src="/assets/icons/btc-logo.svg" alt="Beyond the Cities logo" class="brand-mark" />
        </div>
        <h1 id="site-title">
          <span class="title-line">
            <span class="title-beyond">BEYOND</span>
          </span>
          <span class="title-line">
            <span class="title-the">the</span>
            <span class="title-cities">CITIES</span>
          </span>
        </h1>
        <p id="site-subtitle">Artists' residences<br />in the Western Balkans</p>
      </section>

      <section id="filter-card" aria-label="Map filters">
        <div id="filter-content">
          <div class="filter-group">
            <button type="button" class="select-row" data-toggle-target="country-filter-list" aria-expanded="false">
              <span>Country</span>
              <img src="/assets/icons/caret-down.svg" alt="" />
            </button>
            <div id="country-filter-list" class="pill-list" hidden>
              <label class="pill-filter-item country-pill">
                <input type="checkbox" name="country" value="Serbia" checked />
                <span>Serbia</span>
              </label>
              <label class="pill-filter-item country-pill">
                <input type="checkbox" name="country" value="Bosnia and Herzegovina" checked />
                <span>Bosnia and Herzegovina</span>
              </label>
              <label class="pill-filter-item country-pill">
                <input type="checkbox" name="country" value="North Macedonia" checked />
                <span>North Macedonia</span>
              </label>
            </div>
          </div>

          <div class="filter-group">
            <button type="button" class="select-row" data-toggle-target="discipline-filters" aria-expanded="false">
              <span>Art field</span>
              <img src="/assets/icons/caret-down.svg" alt="" />
            </button>
            <div id="discipline-filters" class="pill-list" hidden></div>
          </div>

          <div class="filter-group">
            <label class="filter-check is-round">
              <input type="checkbox" name="scope" value="National" checked />
              <span class="round-check-icon"><img src="/assets/icons/check.svg" alt="" /></span>
              <span class="pill-light">National</span>
            </label>
            <label class="filter-check is-round">
              <input type="checkbox" name="scope" value="Regional" checked />
              <span class="round-check-icon"><img src="/assets/icons/check.svg" alt="" /></span>
              <span class="pill-light">Regional</span>
            </label>
            <label class="filter-check is-round">
              <input type="checkbox" name="scope" value="International" checked />
              <span class="round-check-icon"><img src="/assets/icons/check.svg" alt="" /></span>
              <span class="pill-light">International</span>
            </label>
          </div>

          <p class="filter-counter"><strong id="colony-count">0</strong> colonies</p>
        </div>

        <div id="filter-decor" aria-hidden="true"></div>
      </section>

      <button type="button" id="filter-minimize" aria-label="Minimize filters" aria-expanded="true">
        <img src="/assets/icons/dropdown-caret-icon.svg" alt="" />
      </button>
    </aside>

    <main id="map-container" aria-label="Interactive map">
      <button type="button" id="filter-toggle" aria-label="Toggle filters" aria-expanded="false">
        Filters
      </button>
      <div id="map"></div>
    </main>

    <aside id="detail-panel" aria-label="Colony details" aria-hidden="true">
      <button type="button" id="panel-close" aria-label="Close panel">
        <img src="/assets/icons/x.svg" alt="" />
      </button>

      <button type="button" id="panel-minimize" aria-label="Minimize panel" aria-expanded="true">
        <img src="/assets/icons/dropdown-caret-icon.svg" alt="" />
      </button>

      <div id="panel-content">
        <div id="panel-photo-wrap">
          <img id="panel-photo" src="" alt="" />
        </div>

        <header id="panel-header">
          <h2 id="panel-name"></h2>
          <p id="panel-location"></p>
          <div id="panel-meta-inline">
            <div id="panel-marker-badge">
              <img id="panel-marker-icon" src="/assets/icons/house01.svg" alt="" />
            </div>
            <div id="panel-disciplines"></div>
          </div>
        </header>

        <section id="panel-about">
          <h3>Organizers</h3>
          <p id="panel-organizer">N/A</p>
        </section>

        <section id="panel-details">
          <h3>Details</h3>
          <ul id="panel-details-list">
            <li><strong>Contact person:</strong> <span id="panel-contact-person">N/A</span></li>
            <li><strong>Time period:</strong> <span id="panel-time-period">N/A</span></li>
            <li><strong>Duration:</strong> <span id="panel-duration">N/A</span></li>
            <li><strong>Scope:</strong> <span id="panel-scope">N/A</span></li>
          </ul>
        </section>

        <section id="panel-contact">
          <h3>Contact</h3>
          <ul id="panel-contact-list"></ul>
        </section>

        <div id="panel-social"></div>
      </div>
    </aside>

  </div>

  <script type="module" src="/main.js"></script>
</body>

</html>
